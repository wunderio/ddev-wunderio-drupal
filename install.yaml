name: ddev-wunderio-drupal
ddev_version_constraint: ">= v1.24.3"

# Files copied into the project root preserving paths
# The dist folder structure mirrors the target project structure
project_files:
  - config.wunderio.yaml
  - docker-compose.wunderio.yaml
# - drush/sites/local.site.yml

global_files:
  - commands/
  - homeadditions/

# pre_install_actions - list of actions to run before installing the addon.
pre_install_actions:
  - |
    # Removal of hacky way to bind wdr-core to containers use homeadditions
    # Based on maintaners comment https://github.com/orgs/ddev/discussions/7149#discussioncomment-12634740
    if [ -f "${DDEV_GLOBAL_DIR}/wunderio/core/wdr-core.sh" ]; then
      rm -rf "${DDEV_GLOBAL_DIR}/wunderio";
    fi

# When plugin is unistalled clean up the global folders.
removal_actions:
  - rm -rf "${DDEV_GLOBAL_DIR}/homeadditions"
  - rm -rf "${DDEV_GLOBAL_DIR}/wunderio/core"
